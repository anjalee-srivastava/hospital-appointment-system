server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:hospitaldb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: hospital-appointment-system-secret-key-2024-very-long-secret
    expiration: 86400000  # 24 hours

logging:
  level:
    com.hospital: DEBUG
